<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/icons/favicon.ico" />
    <title>My New Tab</title>
    <link rel="stylesheet" href="./css/newtab.css" />
  </head>
  <body>
    <div class="outter-wrapper">
      <div class="container">
        <div class="todo-input-container flex">
          <input
            type="text"
            class="todo-input"
            placeholder="Add a new task..."
            id="todoInput"
          />
          <button class="add-button" id="addButton">Add</button>
        </div>

        <ul class="todo-list" id="todoList"></ul>
        <button
          class="clear-completed-button"
          id="clearCompletedButton"
          style="display: none"
        >
          Clear Completed
        </button>
      </div>

      <footer class="footer flex">
        <div class="history-link">
          <button id="show-dialog">History</a>
        </div>
      </footer>

    </div>
    <dialog id="historyDialog">
      <div class="dialog-header flex">
        <h2>History</h2>
        <div class="dialog-controls">
          <button id="clear-all-history">Clear All</button>
          <button id="js-close">&times; Close</button>
        </div>
      </div>
      <div class="dialog-content">
        <ul class="history-list" id="historyList"></ul>
      </div>
    </dialog>
    <script src="./js/index.js" type="module"></script>
    <script src="./js/dialog.js" type="module" async defer></script>
  </body>
</html>
